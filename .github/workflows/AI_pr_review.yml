name: AI code review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # needed only if the service posts using this run's token

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AI code review → POST /review_pr
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request, urllib.error

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).stdout

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          base = f"origin/{event['pull_request']['base']['ref']}"
          diff_range = f"{base}...HEAD"

          git("fetch", "--no-tags", "origin", event["pull_request"]["base"]["ref"])
          diff = git("diff", diff_range)
          status = git("diff", "--name-status", diff_range).strip().splitlines()

          TYPE = {"A": "add", "M": "edit", "D": "delete", "R": "rename"}
          MAX_FILE_CHARS = 40_000
          changed_files, context_files = [], []
          for line in status:
              parts = line.split("\t")
              code = parts[0][0]
              change_type = TYPE.get(code, "edit")
              path = parts[-1]
              prev = parts[1] if code == "R" and len(parts) == 3 else None
              changed_files.append({"path": path, "change_type": change_type, "previous_path": prev})
              if change_type != "delete" and os.path.isfile(path):
                  try:
                      content = open(path, encoding="utf-8", errors="replace").read()
                  except OSError:
                      continue
                  truncated = len(content) > MAX_FILE_CHARS
                  context_files.append({
                      "path": path, "content": content[:MAX_FILE_CHARS],
                      "truncated": truncated, "relation": "changed",
                  })

          payload = {
              "pr": {
                  "provider": "github",
                  "repository": os.environ["GITHUB_REPOSITORY"],       # "owner/repo"
                  "pull_request_number": event["pull_request"]["number"],
                  "source_branch": event["pull_request"]["head"]["ref"],
                  "target_branch": event["pull_request"]["base"]["ref"],
                  "source_commit": event["pull_request"]["head"]["sha"],
              },
              "diff": diff,
              "changed_files": changed_files,
              "context_files": context_files,
              "post_mode": "comment",
              "idempotency_key": f"{event['pull_request']['number']}:{event['pull_request']['head']['sha']}",
              "github_auth_token": os.environ.get("GH_TOKEN"),   # forwarded for the GitHub Issues/PR comments API call
          }

          req = urllib.request.Request(
              os.environ["SERVICE_URL"].rstrip("/") + "/review_pr",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {os.environ['SERVICE_API_KEY']}",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=180) as resp:
                  body = json.loads(resp.read().decode("utf-8"))
          except (urllib.error.HTTPError, urllib.error.URLError) as e:
              print(f"Review service call failed: {e}")
              sys.exit(0)   # fail-open

          findings = body.get("findings", [])
          print(f"Review complete: {len(findings)} finding(s), gate={body.get('gate')}")
          for f in findings:
              print(f"  [{f['severity'].upper()}] {f['file']}:{f.get('line','-')} — {f['comment'][:120]}")
          PY
