name: Graphify graph sync

# Builds/updates graphify-out/ (code-only AST graph + community clustering).
#
# - pull_request (opened): rebuilds the graph on the PR head but only
#   uploads it as a workflow artifact for graphify-impact-check to consume —
#   it is NOT committed to the PR branch. graphify-out is a generated
#   JSON/HTML blob whose content isn't line-mergeable; committing it on both
#   the PR branch and main independently (each regenerated from a different
#   point in history) is what caused merge conflicts on every PR.
# - push to main: the only job that ever commits graphify-out, always in
#   sequence (see concurrency group below), so it never conflicts with
#   itself and PR branches never carry a divergent copy to conflict with.
#
# NOTES before you paste this into another repo:
# - If the PR comes from a fork, GITHUB_TOKEN cannot push to the fork's head
#   branch, so the guard step below skips the artifact build/upload too —
#   graphify-impact-check will then just see no impacted-caller context.
#   graphify-main still updates main once the PR is merged.
on:
  pull_request:
    types: [opened]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: graphify-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  graphify-pr-head:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Guard against forked PR head (no push rights)
        id: guard
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "PR head is from a fork (${{ github.event.pull_request.head.repo.full_name }}) — GITHUB_TOKEN cannot push there. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install graphify
        if: steps.guard.outputs.skip != 'true'
        run: pip install graphifyy

      - name: Build code graph (AST-only, no LLM key required)
        if: steps.guard.outputs.skip != 'true'
        run: graphify extract . --code-only

      - name: Cluster communities (no LLM naming)
        if: steps.guard.outputs.skip != 'true'
        run: graphify cluster-only . --no-label

      - name: Upload graphify-out as a build artifact (not committed — see header notes)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out
          path: graphify-out/
          retention-days: 1

  graphify-main:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install graphify
        run: pip install graphifyy

      - name: Build code graph (AST-only, no LLM key required)
        run: graphify extract . --code-only

      - name: Cluster communities (no LLM naming)
        run: graphify cluster-only . --no-label

      - name: Commit and push graphify-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/graph.html graphify-out/GRAPH_REPORT.md graphify-out/manifest.json
          if git diff --staged --quiet; then
            echo "graphify-out is already up to date on main"
          else
            git commit -m "chore(graphify): update graphify-out [skip ci]"
            git push origin HEAD:main
          fi

  # Fails the check if Gemini judges the diff likely to break one of the
  # callers/importers the freshly rebuilt graph says depend on the changed
  # files. Needs graphify-pr-head so it can download that job's graph.json
  # artifact instead of reading a stale one committed to the branch.
  # Structural blast-radius lookup is free (jq against graph.json); only the
  # compatibility judgment itself calls Gemini. Requires a GEMINI_API_KEY
  # repo secret. This only re-runs on `opened`, matching graphify-pr-head
  # above — add `synchronize` to both triggers if you want it to re-check
  # every new push to the PR, not just the first one.
  graphify-impact-check:
    if: github.event_name == 'pull_request'
    needs: graphify-pr-head
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download the freshly built graph (skips cleanly if the PR-head job was skipped, e.g. forked PR)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: graphify-out
          path: graphify-out/

      - name: Find changed files
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
            -- '*.py' '*.ts' '*.js' > changed_files.txt
          echo "Changed files:"; cat changed_files.txt

      - name: Find impacted callers via the committed graph
        run: |
          : > impacted.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            node_ids=$(jq -r --arg f "$file" '.nodes[] | select(.source_file == $f) | .id' graphify-out/graph.json)
            for id in $node_ids; do
              jq -r --arg id "$id" '
                .links[]
                | select((.target == $id or .source == $id)
                         and (.relation == "calls" or .relation == "imports" or .relation == "imports_from"))
                | (.source_file // empty)
              ' graphify-out/graph.json
            done
          done < changed_files.txt | sort -u > impacted.txt
          echo "Impacted files:"; cat impacted.txt

      - name: Build diff + impacted-caller context
        run: |
          git diff "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- $(cat changed_files.txt) > pr.diff
          : > context.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "=== $file ===" >> context.txt
            cat "$file" >> context.txt
          done < impacted.txt

      - name: Ask Gemini whether the diff breaks any impacted caller
        id: judge
        run: |
          PROMPT=$(jq -n \
            --rawfile diff pr.diff \
            --rawfile context context.txt \
            '"Diff:\n" + $diff + "\n\nImpacted callers (unchanged files that depend on the changed code):\n" + $context + "\n\nDoes this diff break any of the impacted callers shown above? Reply with a single first line that is exactly BREAKS or SAFE, then a short explanation on the following lines."'
          )
          BODY=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          VERDICT_TEXT=$(jq -r '.candidates[0].content.parts[0].text // empty' response.json)
          # a failed/empty call must surface as ERROR, not silently pass as SAFE
          if [ "$HTTP_STATUS" != "200" ] || [ -z "$VERDICT_TEXT" ]; then
            echo "::warning::Gemini call failed (HTTP $HTTP_STATUS) or returned no candidates — raw response below"
            cat response.json
            VERDICT_TEXT=$'ERROR\nGemini call failed with HTTP '"$HTTP_STATUS"$' or returned no candidates; see job logs for the raw response.'
          fi
          echo "$VERDICT_TEXT" > verdict.txt
          cat verdict.txt
          echo "verdict=$(head -n1 verdict.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Post Gemini's verdict as a PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const verdict = '${{ steps.judge.outputs.verdict }}';
            const icon = verdict === 'BREAKS' ? '⚠️' : verdict === 'ERROR' ? '❌' : '✅';
            const body = fs.readFileSync('verdict.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${icon} **Graphify impact check (Gemini)**\n\n${body}`
            });

      - name: Fail check unless Gemini confirmed it's safe
        if: steps.judge.outputs.verdict != 'SAFE'
        run: |
          echo "::error::Blocking merge — verdict was '${{ steps.judge.outputs.verdict }}', not SAFE:"
          cat verdict.txt
          exit 1
